# Case 4: Mutual TLS (mTLS) — both sides present certificates
# Run from repo root: mosquitto -c telegrapher/test/4_mtls.conf
# Requires: broker.crt, broker.key, ca.crt (run setup.sh first)
#
# The client cert is auto-generated by certgen (EnsureExists) the first time.
# The broker verifies the client cert against the same CA.
# To make this work: sign the auto-generated client cert with your CA, OR
# set use_identity_as_username true and allow_anonymous true for testing.
#
# Easiest test path: let the broker require a cert but not verify its identity
# (use_identity_as_username false, require_certificate true, no cafile for client).
#
# systemconfig.json traits:
# {
#   "broker": "ssl://localhost:7004",
#   "security": {
#     "caFile": "../telegrapher/test/ca.crt",
#     "certFile": "../telegrapher/test/client.pem",
#     "keyFile":  "../telegrapher/test/client.key"
#   }
# }
# certgen will auto-generate client.pem and client.key on first run.
# Then sign the client cert with the test CA:
#   openssl x509 -req -days 365 -in <(openssl x509 -in client.pem -noout -text) ...
# (see README note below — for quick local testing, use require_certificate false)

listener 7004
allow_anonymous true

cafile telegrapher/test/ca.crt
certfile telegrapher/test/broker.crt
keyfile telegrapher/test/broker.key

# Require clients to present a certificate
require_certificate true
# Use the same CA to verify client certs
# (comment this out if client certs are self-signed, not CA-signed)
# use_identity_as_username false
