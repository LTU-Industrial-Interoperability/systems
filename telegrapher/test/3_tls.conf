# Case 3: TLS — encrypted channel, broker identity verified by client
# Run from repo root: mosquitto -c telegrapher/test/3_tls.conf
# Requires: broker.crt, broker.key, ca.crt (run setup.sh first)
#
# The client uses ca.crt to verify the broker. No client cert required.
#
# systemconfig.json traits:
# {
#   "broker": "ssl://localhost:7003",
#   "security": { "caFile": "../telegrapher/test/ca.crt" }
# }
# Or with username/password on top:
# {
#   "broker": "ssl://localhost:7003",
#   "security": {
#     "caFile": "../telegrapher/test/ca.crt",
#     "username": "testuser",
#     "password": "testpass"
#   }
# }

listener 7003
allow_anonymous true

cafile telegrapher/test/ca.crt
certfile telegrapher/test/broker.crt
keyfile telegrapher/test/broker.key

# Clients do NOT need a certificate (one-way TLS)
require_certificate false
