# Case 2: Username / password — no TLS
# Run from repo root: mosquitto -c telegrapher/test/2_password.conf
# Requires: passwords file (run setup.sh first)
#
# systemconfig.json traits:
# {
#   "broker": "tcp://localhost:7002",
#   "security": { "username": "testuser", "password": "testpass" }
# }

listener 7002
allow_anonymous false
password_file telegrapher/test/passwords
